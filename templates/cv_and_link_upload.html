<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV ve Link Yükleme</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            background-color: #fff;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .user-info {
            font-size: 18px;
            color: #333;
        }

        .logout-btn {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        .logout-btn:hover {
            background-color: #c82333;
        }

        .upload-section {
            background-color: #fff;
            padding: 30px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }

        .form-group input[type="file"],
        .form-group input[type="url"],
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }

        .form-group textarea {
            height: 100px;
            resize: vertical;
        }

        .submit-btn {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }

        .submit-btn:hover {
            background-color: #0056b3;
        }

        .submit-btn:disabled {
            background-color: #6c757d;
            cursor: not-allowed;
        }

        .message {
            padding: 10px;
            margin-bottom: 20px;
            border-radius: 5px;
            display: none;
        }

        .message.success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }

        .message.error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="user-info">
                Hoş geldiniz, <span id="username">{{ session.get('fullname', session.get('username', '')) }}</span>
            </div>
            <button class="logout-btn" onclick="logout()">Çıkış Yap</button>
        </div>

        <div class="upload-section">
            <h2>CV ve Link Yükleme</h2>

            <div id="message" class="message"></div>

            <form id="uploadForm" enctype="multipart/form-data">
                <div class="form-group">
                    <label for="cv">CV Dosyası (PDF, DOC, DOCX)</label>
                    <input type="file" id="cv" name="cv" accept=".pdf,.doc,.docx" required>
                </div>

                <div class="form-group">
                    <label for="linkedin">Link of Job</label>
                    <input type="url" id="linkedin" name="linkedin" placeholder="https://linkedin.com/in/username" required>
                </div>

                <div class="form-group">
                    <label for="github">GitHub Profil Linki (Opsiyonel)</label>
                    <input type="url" id="github" name="github" placeholder="https://github.com/username">
                </div>

                <div class="form-group">
                    <label for="portfolio">Portfolio/Website Linki (Opsiyonel)</label>
                    <input type="url" id="portfolio" name="portfolio" placeholder="https://example.com">
                </div>

                <div class="form-group">
                    <label for="notes">Ek Notlar (Opsiyonel)</label>
                    <textarea id="notes" name="notes" placeholder="Eklemek istediğiniz notlar..."></textarea>
                </div>

                <button type="submit" class="submit-btn" id="submitBtn">Yükle</button>
            </form>
        </div>
    </div>

    <script>
        // Oturum kontrolü
        fetch('/api/check-session')
            .then(response => response.json())
            .then(data => {
                if (!data.logged_in) {
                    window.location.href = '/';
                }
            });

        // Çıkış işlemi
        function logout() {
            fetch('/api/logout')
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        window.location.href = '/';
                    }
                });
        }

        // Form gönderme işlemi
        document.getElementById('uploadForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const formData = new FormData(this);
            const messageDiv = document.getElementById('message');
            const submitBtn = document.getElementById('submitBtn');

            // Butonu devre dışı bırak ve metnini değiştir
            submitBtn.disabled = true;
            submitBtn.textContent = 'Yükleniyor...';

            fetch('/api/upload-cv-links', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                messageDiv.className = 'message ' + (data.success ? 'success' : 'error');
                messageDiv.textContent = data.message;

                if (data.success) {
                    this.reset();

                    // Yönlendirme varsa sayfayı yönlendir
                    if (data.redirect) {
                        messageDiv.textContent += ' Yönlendiriliyorsunuz...';
                        setTimeout(() => {
                            window.location.href = data.redirect;
                        }, 2000);
                    } else {
                        submitBtn.disabled = false;
                        submitBtn.textContent = 'Yükle';
                    }
                } else {
                    // Hata durumunda butonu tekrar aktif et
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Yükle';
                }
            })
            .catch(error => {
                messageDiv.className = 'message error';
                messageDiv.textContent = 'Bir hata oluştu: ' + error;

                // Hata durumunda butonu tekrar aktif et
                submitBtn.disabled = false;
                submitBtn.textContent = 'Yükle';
            });
        });
    </script>
</body>
</html>
